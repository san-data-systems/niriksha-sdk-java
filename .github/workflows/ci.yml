name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build, test, checkstyle, SpotBugs, JaCoCo
        run: mvn verify --batch-mode --no-transfer-progress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # The NVD download, not the analysis, is what takes time here. Without an
    # NVD_API_KEY secret the API is heavily throttled: a cold, keyless full
    # download has hit GitHub's 6-hour job limit. The cache below makes every
    # run after the first incremental (minutes); an NVD API key (free, see
    # https://nvd.nist.gov/developers/request-an-api-key) fixes the cold case.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      # The NVD database evolves every run, so the key never matches and the
      # restore-key pulls the newest previous copy; the post step then saves
      # the updated one under this run's key.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-db-${{ runner.os }}-
      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            --batch-mode --no-transfer-progress \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=owasp-suppressions.xml \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.html

  branch-gate:
    name: Branch Gate (develop → main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Enforce develop → main only
        run: |
          if [[ "${{ github.head_ref }}" != "develop" ]]; then
            echo "ERROR: Only the 'develop' branch may be merged into 'main'."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi
