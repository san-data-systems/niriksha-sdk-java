name: Dev Release

on:
  push:
    branches: [develop]

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    name: Publish Dev Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compute dev version
        id: ver
        run: |
          BASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --batch-mode)
          BASE="${BASE%-SNAPSHOT}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DEV_VERSION="${BASE}-dev.${SHORT_SHA}"
          echo "dev_version=${DEV_VERSION}" >> $GITHUB_OUTPUT
          echo "Dev version: ${DEV_VERSION}"

      - name: Set dev version in pom.xml
        run: |
          mvn versions:set -DnewVersion="${{ steps.ver.outputs.dev_version }}" \
            --batch-mode --no-transfer-progress -q

      - name: Build and run tests
        run: mvn verify --batch-mode --no-transfer-progress -DskipSpotBugs=false

      - name: Collect artifacts
        run: |
          mkdir -p staging
          cp target/niriksha-sdk-java-*.jar staging/ 2>/dev/null || true
          cp target/niriksha-sdk-java-*-sources.jar staging/ 2>/dev/null || true
          ls -lh staging/

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.dev_version }}
          name: "Dev Build ${{ steps.ver.outputs.dev_version }}"
          prerelease: true
          generate_release_notes: true
          files: staging/*
          body: |
            🔧 **Automated dev build** — not for production use.

            Install via JitPack or copy the JAR from the release assets.

            **Commit:** ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
