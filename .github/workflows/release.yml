name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Auto-version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Run tests
        run: mvn test --batch-mode --no-transfer-progress

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main

      - name: Update version in pom.xml
        run: |
          NEW_VERSION="${{ steps.tag.outputs.new_version }}"
          mvn versions:set -DnewVersion="${NEW_VERSION}" --batch-mode --no-transfer-progress -q
          mvn versions:commit --batch-mode -q

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.tag.outputs.new_version }} [skip ci]"
          git push

      - name: Deploy to Maven Central
        run: mvn deploy -P release --batch-mode --no-transfer-progress -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "v${{ steps.tag.outputs.new_version }}"
          generate_release_notes: true
          body: ${{ steps.tag.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
