spring.application.name=spring-boot-demo
server.port=8080

# NirikshaAI SDK configuration
# Override these with environment variables or a profile-specific properties file.
niriksha.endpoint=https://app.niriksha.ai
niriksha.otlp-endpoint=grpc-ingest.niriksha.ai:4317
niriksha.service-name=spring-boot-demo
niriksha.environment=production

# The API key is read from the NIRIKSHA_API_KEY environment variable by default.
# You can also set it here (not recommended for production):
# niriksha.api-key=nai_your_key_here

# Spring Boot logging
logging.level.ai.niriksha=DEBUG
logging.level.com.example.demo=INFO
